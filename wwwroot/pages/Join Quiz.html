<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Java Master - Join Quiz</title>
  <link rel="icon" href="/logo/java-master-logo.png" type="image/png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    /* ==========================================================
       Base
       1 unit = 1/1920 of the screen width, so every number is a
       pixel value from the 1920 wide mockup.
       ========================================================== */
    :root {
      --u: calc(100vw / 1920);
      --cream: #f0e0cb;
      --cream-edge: #b79f84;
      --orange: #c9572f;
      --orange-edge: #8e3a1d;
      --teal: #62c1cc;
      --muted: #b99f8a;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      color: #f6ebde;
      background: #120d0b;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Fluted glass background.
       Layer 1 (.bg): the same colors as before (warm glow top left,
       light patch bottom right).
       Layer 2 (.bg::before): the glass ribs on top of the colors.
       Layer 3 (.bg::after): a slow, wide brightness change so the
       ribs don't all look identical. */
    .bg {
      --rib: 18px;   /* width of one glass rib, change this to make ribs thinner or thicker */
      position: fixed;
      inset: 0;
      z-index: 0;
      background:
        radial-gradient(ellipse 40% 45% at 92% 100%, rgba(170, 145, 108, .6), transparent 70%),
        radial-gradient(ellipse 55% 60% at 18% 8%, rgba(190, 92, 40, .55), transparent 70%),
        #140e0c;
      overflow: hidden;
    }

    .bg::before {
      content: "";
      position: absolute;
      inset: 0;
      /* each rib: bright edge -> soft middle -> dark edge, like light bending through a curved ridge */
      background:
        repeating-linear-gradient(
          90deg,
            rgba(255, 235, 210, .05) 0,
            rgba(255, 235, 210, .01) calc(var(--rib) * .35),
            rgba(0, 0, 0, .05) calc(var(--rib) * .75),
            rgba(0, 0, 0, .14) calc(var(--rib) - 2px),
            rgba(0, 0, 0, .20) var(--rib)
        );
      /* slight blur and stretch of what is behind, which gives the frosted look */
      -webkit-backdrop-filter: blur(3px) saturate(1.15);
      backdrop-filter: blur(3px) saturate(1.15);
    }

    .bg::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        repeating-linear-gradient(
          90deg,
          rgba(255, 255, 255, .02) 0 calc(var(--rib) * 2),
          rgba(0, 0, 0, .04) calc(var(--rib) * 2) calc(var(--rib) * 5),
          rgba(255, 255, 255, .02) calc(var(--rib) * 5) calc(var(--rib) * 7)
        );
      mix-blend-mode: soft-light;
    }

    .page {
      position: relative;
      z-index: 1;
      min-height: max(100vh, calc(1020 * var(--u)));
    }

    /* ==========================================================
       Header (logo + user)
       ========================================================== */
    .top {
      display: contents;
    }

    .logo {
      position: absolute;
      left: calc(60 * var(--u));
      top: calc(40 * var(--u));
    }

    .logo img {
      display: block;
      height: calc(90 * var(--u));
    }

    .user {
      position: absolute;
      right: calc(72 * var(--u));
      top: calc(50 * var(--u));
      display: flex;
      align-items: center;
      gap: calc(14 * var(--u));
      font-size: calc(21 * var(--u));
      font-weight: 500;
    }

    .user img {
      width: calc(48 * var(--u));
      height: calc(48 * var(--u));
      border-radius: 50%;
      object-fit: cover;
    }

    /* ==========================================================
       Title and subtitle
       ========================================================== */
    .title {
      position: absolute;
      left: calc(155 * var(--u));
      top: calc(150 * var(--u));
      font-size: calc(92 * var(--u));
      line-height: 1.08;
      font-weight: 800;
      letter-spacing: -.02em;
      color: #f3e6d6;
    }

    .sub {
      position: absolute;
      left: calc(155 * var(--u));
      top: calc(392 * var(--u));
      width: calc(700 * var(--u));
      font-size: calc(27 * var(--u));
      line-height: 1.3;
      color: var(--muted);
    }

    /* ==========================================================
       Six code boxes
       ========================================================== */
    .code {
      position: absolute;
      left: calc(153 * var(--u));
      top: calc(510 * var(--u));
      display: flex;
      gap: calc(12 * var(--u));
    }

    .code-box {
      width: calc(100 * var(--u));
      height: calc(124 * var(--u));
      border-radius: calc(20 * var(--u));
      border: calc(4 * var(--u)) solid transparent;
      background: var(--cream);
      box-shadow:
        0 calc(8 * var(--u)) 0 var(--cream-edge),
        0 calc(16 * var(--u)) calc(24 * var(--u)) rgba(0, 0, 0, .35);
      text-align: center;
      font: 700 calc(56 * var(--u)) 'Inter', sans-serif;
      color: #3a2418;
      text-transform: uppercase;
      outline: none;
      caret-color: var(--orange);
    }

    .code-box:focus {
      background: #fff8ee;
      border-color: #e0632f;
      box-shadow:
        0 calc(8 * var(--u)) 0 var(--cream-edge),
        0 0 0 calc(3 * var(--u)) rgba(224, 99, 47, .35),
        0 calc(16 * var(--u)) calc(24 * var(--u)) rgba(0, 0, 0, .35);
    }

    .code.shake {
      animation: shake .4s;
    }

    @keyframes shake {
      20% { transform: translateX(-8px); }
      40% { transform: translateX(8px); }
      60% { transform: translateX(-5px); }
      80% { transform: translateX(5px); }
    }

    /* ==========================================================
       Join button and message
       ========================================================== */
    .join {
      position: absolute;
      left: calc(155 * var(--u));
      top: calc(672 * var(--u));
      width: calc(228 * var(--u));
      height: calc(76 * var(--u));
      border: 0;
      border-radius: calc(14 * var(--u));
      background: var(--orange);
      color: #fff;
      font: 700 calc(27 * var(--u)) 'Inter', sans-serif;
      cursor: pointer;
      box-shadow: 0 calc(7 * var(--u)) 0 var(--orange-edge);
      transition: transform .1s, box-shadow .1s;
    }

    .join:hover {
      background: #d4633a;
    }

    .join:active {
      transform: translateY(calc(4 * var(--u)));
      box-shadow: 0 calc(3 * var(--u)) 0 var(--orange-edge);
    }

    .join:focus-visible,
    .rejoin:focus-visible {
      outline: 3px solid #f1c27d;
      outline-offset: 3px;
    }

    .msg {
      position: absolute;
      left: calc(155 * var(--u));
      top: calc(790 * var(--u));
      width: calc(760 * var(--u));
      font-size: calc(21 * var(--u));
      line-height: 1.35;
      color: #e9b48f;
    }

    /* ==========================================================
       Recent joined decks
       ========================================================== */
    .recent {
      position: absolute;
      left: calc(1075 * var(--u));
      top: calc(247 * var(--u));
      width: calc(679 * var(--u));
      padding: calc(36 * var(--u)) calc(34 * var(--u)) calc(14 * var(--u));
      border-radius: calc(40 * var(--u));
      background: rgba(20, 14, 12, .62);
      border: 1px solid rgba(255, 255, 255, .09);
      backdrop-filter: blur(6px);
      box-shadow: 0 calc(20 * var(--u)) calc(60 * var(--u)) rgba(0, 0, 0, .4);
    }

    .recent h2 {
      font-size: calc(28 * var(--u));
      font-weight: 700;
    }

    .recent .hint {
      margin-top: calc(8 * var(--u));
      font-size: calc(20 * var(--u));
      color: var(--muted);
    }

    .recent ul {
      list-style: none;
      margin-top: calc(26 * var(--u));
      border-top: 1px solid rgba(255, 255, 255, .1);
    }

    .recent li {
      display: flex;
      align-items: center;
      gap: calc(18 * var(--u));
      padding: calc(20 * var(--u)) 0;
      border-bottom: 1px solid rgba(255, 255, 255, .1);
    }

    .recent li:last-child {
      border-bottom: 0;
    }

    .dot {
      width: calc(15 * var(--u));
      height: calc(15 * var(--u));
      border-radius: 50%;
      flex: none;
    }

    .deck-name {
      font-size: calc(23 * var(--u));
      font-weight: 600;
    }

    .deck-when {
      margin-top: calc(4 * var(--u));
      font-size: calc(20 * var(--u));
      color: var(--muted);
    }

    .rejoin {
      margin-left: auto;
      width: calc(106 * var(--u));
      height: calc(50 * var(--u));
      border: calc(2 * var(--u)) solid #2f8f9c;
      border-radius: calc(10 * var(--u));
      background: transparent;
      color: var(--teal);
      font: 600 calc(20 * var(--u)) 'Inter', sans-serif;
      cursor: pointer;
    }

    .rejoin:hover {
      background: rgba(98, 193, 204, .12);
    }

    /* ==========================================================
       Phones and small tablets: stack everything
       ========================================================== */
    @media (max-width: 900px) {
      :root {
        --u: calc(100vw / 800);
      }

      .page {
        display: flex;
        flex-direction: column;
        gap: calc(34 * var(--u));
        padding: calc(40 * var(--u)) calc(60 * var(--u)) calc(70 * var(--u));
      }

      .top {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .logo,
      .user,
      .title,
      .sub,
      .code,
      .join,
      .msg,
      .recent {
        position: static;
        width: auto;
      }

      .code {
        gap: calc(12 * var(--u));
      }

      .code-box {
        flex: 1;
        min-width: 0;
        height: calc(130 * var(--u));
      }

      .join {
        width: 100%;
        height: calc(90 * var(--u));
        font-size: calc(34 * var(--u));
      }

      .sub {
        font-size: calc(30 * var(--u));
      }

      .msg {
        font-size: calc(26 * var(--u));
      }

      .recent {
        padding: calc(40 * var(--u));
      }

      .recent h2 {
        font-size: calc(38 * var(--u));
      }

      .recent .hint {
        font-size: calc(26 * var(--u));
      }

      .deck-name {
        font-size: calc(30 * var(--u));
      }

      .deck-when {
        font-size: calc(25 * var(--u));
      }

      .rejoin {
        width: calc(150 * var(--u));
        height: calc(70 * var(--u));
        font-size: calc(26 * var(--u));
      }

      .user {
        font-size: calc(26 * var(--u));
      }

      .user img {
        width: calc(60 * var(--u));
        height: calc(60 * var(--u));
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .code.shake {
        animation: none;
      }

      .join {
        transition: none;
      }
    }
  </style>
</head>

<body>
  <div class="bg" aria-hidden="true"></div>

  <main class="page">
    <header class="top">
      <a class="logo" href="/pages/Home.html">
        <img src="/logo/horizontal-logo-javamaster.png" alt="Java Master">
      </a>
      <div class="user">
        <span id="userName">@User01</span>
        <img id="userAvatar" src="/avatars/Avatar 1.png" alt="Profile avatar">
      </div>
    </header>

    <h1 class="title">Got a code?<br>Jump in.</h1>
    <p class="sub">Type the 6-character code from your instructor to join a live quiz.</p>

    <div class="code" id="codeRow" role="group" aria-label="6-character quiz code">
      <input class="code-box" maxlength="1" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Character 1 of 6">
      <input class="code-box" maxlength="1" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Character 2 of 6">
      <input class="code-box" maxlength="1" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Character 3 of 6">
      <input class="code-box" maxlength="1" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Character 4 of 6">
      <input class="code-box" maxlength="1" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Character 5 of 6">
      <input class="code-box" maxlength="1" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Character 6 of 6">
    </div>

    <button type="button" class="join" id="joinBtn">Join deck</button>
    <p class="msg" id="joinMsg" role="status" aria-live="polite"></p>

    <aside class="recent">
      <h2>Recent joined decks</h2>
      <p class="hint">Pick one to fill in its code again.</p>
      <ul id="recentList"></ul>
    </aside>
  </main>

  <script>
    // ---------- Elements and helpers ----------
    const boxes = [...document.querySelectorAll('.code-box')];
    const row = document.getElementById('codeRow');
    const msg = document.getElementById('joinMsg');

    const clean = s => s.toUpperCase().replace(/[^A-Z0-9]/g, '');
    const getCode = () => boxes.map(b => b.value).join('');

    function setCode(text) {
      const c = clean(text).slice(0, 6);
      boxes.forEach((b, i) => b.value = c[i] || '');
      boxes[Math.min(c.length, 5)].focus();
      msg.textContent = '';
    }

    // ---------- Code box behavior ----------
    boxes.forEach((box, i) => {
      // Typing replaces the old character
      box.addEventListener('focus', () => box.select());

      box.addEventListener('input', () => {
        const c = clean(box.value);
        box.value = c.slice(-1);
        msg.textContent = '';
        if (c && i < 5) boxes[i + 1].focus();
      });

      box.addEventListener('keydown', e => {
        if (e.key === 'Backspace' && !box.value && i > 0) {
          boxes[i - 1].value = '';
          boxes[i - 1].focus();
          e.preventDefault();
        } else if (e.key === 'ArrowLeft' && i > 0) {
          boxes[i - 1].focus();
        } else if (e.key === 'ArrowRight' && i < 5) {
          boxes[i + 1].focus();
        } else if (e.key === 'Enter') {
          join();
        }
      });

      box.addEventListener('paste', e => {
        e.preventDefault();
        setCode(e.clipboardData.getData('text'));
      });
    });

    // ---------- Joining ----------
    function join() {
      const code = getCode();

      if (code.length < 6) {
        // Restart the shake animation
        row.classList.remove('shake');
        void row.offsetWidth;
        row.classList.add('shake');

        msg.textContent = 'Enter all 6 characters of the code.';
        (boxes.find(b => !b.value) || boxes[5]).focus();
        return;
      }

      joinWithCode(code);
    }

    // TODO: when multiplayer exists, call the backend here (for example JM.joinGame(code)),
    // then open the waiting room. Until then the page only confirms the code.
    function joinWithCode(code) {
      msg.textContent = 'Code ' + code + ' entered. Joining will work once multiplayer is connected.';
    }

    document.getElementById('joinBtn').addEventListener('click', join);

    // ---------- Recent decks ----------
    // PLACEHOLDER data from the prototype. TODO: load the player's recent decks from the server.
    const recent = [
      { name: 'Java Basics',              when: 'Joined today',      color: '#d85a2b', code: 'JB4K9Q' },
      { name: 'OOP Fundamentals',         when: 'Joined yesterday',  color: '#2f9aa6', code: 'OOP7X2' },
      { name: 'Collections and Generics', when: 'Joined 3 days ago', color: '#e0b43c', code: 'CG3M8T' }
    ];

    const list = document.getElementById('recentList');

    recent.forEach(d => {
      const li = document.createElement('li');

      const dot = document.createElement('span');
      dot.className = 'dot';
      dot.style.background = d.color;

      const info = document.createElement('div');

      const n = document.createElement('div');
      n.className = 'deck-name';
      n.textContent = d.name;

      const w = document.createElement('div');
      w.className = 'deck-when';
      w.textContent = d.when;

      info.append(n, w);

      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'rejoin';
      b.textContent = 'Rejoin';
      b.setAttribute('aria-label', 'Fill in the code for ' + d.name);
      // "Pick one to fill in its code again"
      b.addEventListener('click', () => setCode(d.code));

      li.append(dot, info, b);
      list.append(li);
    });

    // ---------- Username and avatar (same keys as the other pages) ----------
    try {
      document.getElementById('userName').textContent =
        '@' + (localStorage.getItem('loggedInUsername') || 'User01');
      document.getElementById('userAvatar').src =
        localStorage.getItem('profileAvatar') || '/avatars/Avatar 1.png';
    } catch (e) {}

    boxes[0].focus();
  </script>
</body>
</html>
