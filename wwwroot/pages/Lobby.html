<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Java Master - Lobby</title>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" href="/logo/java-master-logo.png" type="image/png">
    <link rel="stylesheet" href="/css/Dashboard-navbar-style.css">
    <link rel="stylesheet" href="/css/Lobby-style.css">
</head>
<body>
    <!-- Sidebar Navigation -->
    <nav class="sidebar">
        <!-- Logo -->
        <div class="logo-section">
            <img src="/logo/horizontal-logo-javamaster.png" alt="Java Master logo" class="logo">
        </div>

        <!-- Navigation Links -->
        <div class="nav-sections">
            
            <a href="Home.html" class="nav-item">
                <img src="/icons/home.png" alt="Home">
                Home
            </a>

            <a href="Learn.html" class="nav-item">
                <img src="/icons/toga cap.png" alt="Learn">
                Learn
            </a>

            <a href="Progress.html" class="nav-item">
                <img src="/icons/coffee.png" alt="Progress">
                Progress
            </a>

            <a href="Profile.html" class="nav-item">
                <img src="/icons/profile.png" alt="Profile">
                Profile
            </a>
            <!-- ACTIVE: this is the Lobby page, so only Lobby has "active" -->
            <a href="Lobby.html" class="nav-item active">
                <img src="/icons/lobby.png" alt="Lobby">
                Lobby
            </a>
        </div>

        <!-- Study Button -->
        <div class="action-buttons">
            <a href="Study.html" class="action-btn study-button">
                <img src="/icons/game console.png" alt="Study">
                Study
            </a>
        </div>
    </nav>

    <!-- Top Bar (no visible bar: just the bell and profile floating on the page) -->
    <div class="top-navbar">
        <a href="Notifications.html" class="icon-button">
            <img src="/icons/notification_bell_icon.png" alt="notification icon">
            <span class="notification-badge hidden" id="notificationBadge"></span>
        </a>

        <!-- Profile Button with Dropdown -->
        <div class="profile-container">
            <button class="profile-button" id="profileButton">
                <img src="/avatars/Avatar 1.png" alt="Profile Avatar" class="profile-avatar" id="navbarAvatar">
                <img src="/icons/dropdown_icon.png" alt="dropdown icon" class="dropdown-icon">
            </button>

            <div class="dropdown-menu" id="dropdownMenu">
                <a href="Profile.html" class="dropdown-item" role="menuitem">
                    <img src="/icons/profile.png" alt="">
                    Profile
                </a>
                <a href="Settings.html" class="dropdown-item" role="menuitem">
                    <img src="/icons/settings_icon.png" alt="">
                    Settings
                </a>
                <a href="FAQ.html" class="dropdown-item" role="menuitem">
                    <img src="/icons/faq_icon.png" alt="">
                    Help
                </a>
                <a href="/" class="dropdown-item logout" id="logoutBtn" role="menuitem">
                    <img src="/icons/logout_icon.png" alt="">
                    Log out
                </a>
            </div>
        </div>
    </div>
    <!-- END of SIDEBAR + TOP BAR (COPY #2 ends here) -->

    <!-- line of codes for lobby page -->
    <main class="lobby-main">
        <p class="lobby-breadcrumb">Lobby</p>

        <div class="lobby-content">

            <!-- Top row: Play + Live Quiz -->
            <div class="lobby-top">

                <!-- Play -->
                <section class="play-section">
                    <h1 class="lobby-heading">Community Play</h1>

                    <div class="play-buttons">
                        <button type="button" class="play-btn host-btn" id="hostDeckBtn">Publish a Deck</button>
                        <button type="button" class="play-btn join-btn" id="joinDeckBtn">Play a Shared Deck</button>
                    </div>
                </section>

                <!-- Class Quiz -->
                <div class="class-quiz">
                    <h1 class="lobby-heading">Class Quiz</h1>

                    <section class="live-quiz-card">
                        <div class="live-quiz-info">
                            <h2 class="live-quiz-title">Live Quiz</h2>
                            <p class="live-quiz-desc">Take a quiz assigned by your professor.</p>
                        </div>

                        <img src="/icons/live quiz.png" alt="Live Quiz" class="live-quiz-img">

                        <a href="/pages/Join Quiz.html" class="enter-code-btn" id="enterClassCodeBtn">Enter class code</a>
                    </section>
                </div>
            </div>

            <!-- Your Decks -->
            <section class="decks-section">
                <div class="decks-head">
                    <h2 class="lobby-heading">Your Decks</h2>

                    <!-- Shown once the user has decks. New Deck opens the loading screen, then Building deck. -->
                    <div class="decks-tools" id="decksTools" hidden>
                        <a href="/pages/Loading-screen.html" class="deck-tool" id="newDeckBtn"><img class="deck-tool-icon" src="/icons/plus.png" alt="">New Deck</a>
                        <div class="sort-wrap">
                            <button type="button" class="deck-tool deck-sort" id="sortBtn" aria-haspopup="menu" aria-expanded="false">
                                <img class="deck-tool-icon" src="/icons/sort.png" alt="">
                                Sort
                            </button>
                            <div class="pop-menu sort-menu" id="sortMenu" role="menu" aria-label="Sort decks" hidden>
                                <button type="button" role="menuitemradio" aria-checked="true" data-sort="newest">Newest edited<img src="/icons/clock.png" alt=""></button>
                                <button type="button" role="menuitemradio" aria-checked="false" data-sort="oldest">Oldest edited<img src="/icons/clock.png" alt=""></button>
                                <button type="button" role="menuitemradio" aria-checked="false" data-sort="az">Alphabetical (A-Z)<img src="/icons/arrow-up.png" alt=""></button>
                                <button type="button" role="menuitemradio" aria-checked="false" data-sort="za">Alphabetical (Z-A)<img src="/icons/arrow-down.png" alt=""></button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- The decks the user created -->
                <div class="decks-grid" id="decksGrid" hidden></div>

                <!-- Empty state (show when the user has no decks) -->
                <div class="decks-empty" id="decksEmptyState">
                    <img src="/icons/letter.png" alt="No Decks Yet" class="decks-empty-img">
                    <h3 class="decks-empty-title">No Decks Yet</h3>
                    <p class="decks-empty-text">You haven’t created any decks yet, start your first one now.</p>
                    <a href="/pages/Loading-screen.html" class="create-deck-btn" id="createDeckBtn">+ Create your first deck</a>
                </div>
            </section>

        </div>
    </main>
<script src="/js/profile-dropdown.js"></script>
<script src="/js/study-modal.js"></script>
<script src="/js/api.js"></script>
<script src="/js/share-deck.js"></script>
<script>
(function () {
    const MAX_TYPE_CHIPS = 2;   // more types than this show as "+3"
    const TYPE_LABELS = {
        'multiple-choice': 'Multiple Choice',
        'true-false': 'True or False',
        'matching': 'Matching Type',
        'fill-blank-code': 'Fill in the Blanks Code',
        'drag-drop-code': 'Drag and Drop Code'
    };

    const $ = id => document.getElementById(id);
    let decks = [];
    let sortKey = 'newest';   // every visit starts with the newest or most recently edited deck first
    let openMenu = null;      // { btn, panel } of the menu that is open right now

    function el(tag, cls, text) {
        const node = document.createElement(tag);
        if (cls) node.className = cls;
        if (text !== undefined) node.textContent = text;   // text only, so a deck name can never run as code
        return node;
    }

    async function loadDecks() {
        try {
            const list = await JM.decks();
            return Array.isArray(list) ? list : [];
        } catch (e) {
            return [];
        }
    }

    /* ---------- sorting ---------- */
    const byName = (a, b) => a.deck.name.localeCompare(b.deck.name, undefined, { sensitivity: 'base', numeric: true });
    const SORTS = {
        newest: (a, b) => (b.at - a.at) || (b.i - a.i),
        oldest: (a, b) => (a.at - b.at) || (a.i - b.i),
        az:     (a, b) => byName(a, b) || (a.i - b.i),
        za:     (a, b) => byName(b, a) || (a.i - b.i)
    };

    function sortedDecks() {
        return decks
            .map((deck, i) => ({ deck: deck, i: i, at: Date.parse(deck.updatedAt || deck.createdAt) || 0 }))
            .sort(SORTS[sortKey])
            .map(x => x.deck);
    }

    function setSort(key) {
        sortKey = key;
        document.querySelectorAll('#sortMenu [data-sort]').forEach(b => b.setAttribute('aria-checked', String(b.dataset.sort === key)));
        renderGrid();
        $('sortBtn').focus();
    }

    /* ---------- menus (the three dots and Sort) ---------- */
    function closeMenus() {
        if (!openMenu) return;
        openMenu.panel.hidden = true;
        openMenu.btn.setAttribute('aria-expanded', 'false');
        openMenu = null;
    }

    function menuItems(panel) {
        return [...panel.querySelectorAll('[role^="menuitem"]')];
    }

    function toggleMenu(btn, panel, byKeyboard) {
        const wasOpen = openMenu && openMenu.panel === panel;
        closeMenus();
        if (wasOpen) return;
        panel.hidden = false;
        btn.setAttribute('aria-expanded', 'true');
        openMenu = { btn: btn, panel: panel };
        if (byKeyboard) menuItems(panel)[0].focus();
    }

    function menuItem(tag, label, icon, href) {
        const item = el(tag, '', label);
        item.setAttribute('role', 'menuitem');
        if (tag === 'a') item.href = href; else item.type = 'button';
        const img = el('img');
        img.src = icon;
        img.alt = '';
        item.appendChild(img);
        return item;
    }

    /* ---------- the cards ---------- */
    function deckCard(deck) {
        const overview = '/pages/Deck overview.html?id=' + encodeURIComponent(deck.id);
        const card = el('article', 'deck-card');

        const cover = el('img', 'deck-cover');
        cover.src = '/cover/cover ' + deck.cover + '.jpg';
        cover.alt = '';

        const menuBtn = el('button', 'deck-menu', '⋮');
        menuBtn.type = 'button';
        menuBtn.setAttribute('aria-label', 'Options for ' + deck.name);
        menuBtn.setAttribute('aria-haspopup', 'menu');
        menuBtn.setAttribute('aria-expanded', 'false');

        // Edit opens the deck overview. Share and Archive are only shown for now: no action.
        const panel = el('div', 'pop-menu card-menu');
        panel.setAttribute('role', 'menu');
        panel.hidden = true;
        const shareItem = menuItem('button', 'Share', '/icons/share.png');
        shareItem.addEventListener('click', () => { closeMenus(); JMShare.open(deck.id, menuBtn); });
        panel.append(
            menuItem('a', 'Edit', '/icons/edit.png', '/pages/Building-deck.html?id=' + encodeURIComponent(deck.id)),
            shareItem,
            menuItem('button', 'Archive', '/icons/archive.png')
        );
        menuBtn.addEventListener('click', e => toggleMenu(menuBtn, panel, e.detail === 0));

        const info = el('div', 'deck-info');
        const title = el('h3', 'deck-name');
        const link = el('a', 'deck-link', deck.name);   // the whole card is clickable through this link
        link.href = overview;
        title.appendChild(link);

        const tags = el('div', 'deck-tags');
        const n = deck.items;
        tags.appendChild(el('span', 'deck-chip', n + (n === 1 ? ' Card' : ' Cards')));
        const types = deck.types || [];
        types.slice(0, MAX_TYPE_CHIPS).forEach(t => tags.appendChild(el('span', 'deck-chip', TYPE_LABELS[t] || t)));
        if (types.length > MAX_TYPE_CHIPS) tags.appendChild(el('span', 'deck-chip', '+' + (types.length - MAX_TYPE_CHIPS)));

        info.append(title, tags);
        card.append(cover, menuBtn, panel, info);
        return card;
    }

    function renderGrid() {
        closeMenus();
        const grid = $('decksGrid');
        grid.innerHTML = '';
        sortedDecks().forEach(d => grid.appendChild(deckCard(d)));
    }

    function render() {
        $('decksEmptyState').hidden = decks.length > 0;
        $('decksTools').hidden = decks.length === 0;
        $('decksGrid').hidden = decks.length === 0;
        renderGrid();
    }

    /* ---------- events ---------- */
    $('sortBtn').addEventListener('click', e => toggleMenu($('sortBtn'), $('sortMenu'), e.detail === 0));
    $('sortMenu').addEventListener('click', e => {
        const b = e.target.closest('[data-sort]');
        if (b) setSort(b.dataset.sort);
    });

    // a click anywhere else closes the open menu
    document.addEventListener('click', e => {
        if (openMenu && !openMenu.panel.contains(e.target) && !openMenu.btn.contains(e.target)) closeMenus();
    });

    // Escape closes it, the arrow keys move through it
    document.addEventListener('keydown', e => {
        if (!openMenu) return;
        if (e.key === 'Escape') {
            const btn = openMenu.btn;
            closeMenus();
            btn.focus();
            return;
        }
        const items = menuItems(openMenu.panel);
        const i = items.indexOf(document.activeElement);
        if (e.key === 'ArrowDown') { e.preventDefault(); items[(i + 1) % items.length].focus(); }
        else if (e.key === 'ArrowUp') { e.preventDefault(); items[(i - 1 + items.length) % items.length].focus(); }
        else if (e.key === 'Home') { e.preventDefault(); items[0].focus(); }
        else if (e.key === 'End') { e.preventDefault(); items[items.length - 1].focus(); }
    });

    $('hostDeckBtn').addEventListener('click', e => JMShare.openPublish(e.currentTarget));
    $('joinDeckBtn').addEventListener('click', e => JMShare.openJoin(e.currentTarget));
    $('decksEmptyState').hidden = true;   // nothing flashes while decks load
    loadDecks().then(list => { decks = list; render(); });
})();
</script>
</body>
</html>
