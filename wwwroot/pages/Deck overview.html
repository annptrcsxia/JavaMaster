<!DOCTYPE html>
<html lang="en">
<head>

    <!-- ===== Deck overview styles (only used on this page) ===== -->
    <style>
        .ov {
            width: min(945px, 100%);
            margin: 0 auto;
            padding: 70px 0 60px;
            font-family: 'Bricolage Grotesque', sans-serif;
            color: #f3e6d8;
        }

        .ov-title {
            margin: 0 0 22px;
            font-size: 28px;
            font-weight: 600;
        }

        /* cover */
        .ov-cover {
            display: block;
            width: 100%;
            aspect-ratio: 4 / 1;
            object-fit: cover;
            border-radius: 6px;
            background: #2a2420;
        }

        /* name, tags and the three buttons */
        .ov-head {
            display: flex;
            flex-wrap: wrap;
            align-items: flex-start;
            justify-content: space-between;
            gap: 16px;
            margin-top: 22px;
            padding-left: 34px;
        }

        .ov-name {
            margin: 0 0 12px;
            font-size: 28px;
            font-weight: 600;
            overflow-wrap: anywhere;
        }

        .ov-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .ov-chip {
            padding: 6px 16px;
            border-radius: 20px;
            background: #6b3414;
            color: #f3e6d8;
            font-size: 13px;
            font-weight: 500;
        }

        .ov-actions {
            display: flex;
            gap: 10px;
        }

        .ov-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            height: 38px;
            padding: 0 18px;
            border: none;
            border-radius: 19px;
            background: #2a2420;
            color: #d9cdc2;
            font: 500 15px 'Bricolage Grotesque', sans-serif;
            cursor: pointer;
        }

        .ov-btn:hover {
            background: #352d28;
        }

        .ov-icon-btn {
            width: 38px;
            padding: 0;
        }

        .ov-btn svg {
            width: 16px;
            height: 16px;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* the questions */
        .ov-cards {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin: 42px 0 0 34px;
        }

        .q-card {
            overflow: hidden;
            border: 1px solid #4a3c34;
            border-radius: 22px;
            background: #221b18;
        }

        .q-text {
            padding: 16px 26px 14px;
        }

        .q-question {
            margin: 0;
            font-size: 19px;
            line-height: 1.35;
            overflow-wrap: anywhere;
        }

        .q-answer {
            padding: 12px 26px 16px;
            border-top: 1px dashed #5b4a40;
            color: #f0b429;
            font-size: 19px;
            overflow-wrap: anywhere;
        }

        /* matching */
        .q-pairs {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
            align-items: baseline;
            gap: 8px 14px;
        }

        .q-pair-item {
            color: #f3e6d8;
        }

        .q-pair-arrow {
            color: #a99c92;
        }

        /* code questions */
        .q-code {
            margin-top: 12px;
            padding: 12px 18px;
            border-radius: 12px;
            background: #1b2133;
            color: #e9e4f2;
            font-size: 15px;
            line-height: 1.55;
        }

        .q-code-line {
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        .q-chip {
            display: inline-block;
            min-width: 24px;
            margin: 0 3px;
            padding: 0 6px;
            border: 1px solid #b98b6a;
            border-radius: 4px;
            background: #f1e3d8;
            color: #3e3a36;
            font-size: 11px;
            font-weight: 600;
            line-height: 18px;
            text-align: center;
            vertical-align: middle;
        }

        .q-nums {
            display: flex;
            flex-wrap: wrap;
            gap: 6px 28px;
        }

        .q-num {
            margin-right: 10px;
            color: #d9cdc2;
            font-size: 14px;
        }

        /* nothing to show */
        .ov-empty {
            max-width: 480px;
            margin: 60px auto 0;
            padding: 32px;
            border: 1px solid #4a3c34;
            border-radius: 22px;
            background: #221b18;
            text-align: center;
        }

        .ov-empty h2 {
            margin: 0 0 8px;
            font-size: 22px;
            font-weight: 600;
        }

        .ov-empty p {
            margin: 0 0 20px;
            color: #b9aea5;
        }

        .ov-link {
            display: inline-block;
            padding: 10px 24px;
            border-radius: 10px;
            background: #167a8a;
            color: #fff;
            font-weight: 600;
            text-decoration: none;
        }

        @media (max-width: 700px) {
            .ov-head {
                padding-left: 0;
            }

            .ov-cards {
                margin-left: 0;
            }

            .q-pairs {
                grid-template-columns: minmax(0, 1fr);
            }

            .q-pair-arrow {
                display: none;
            }
        }
    </style>
</head>

    <!-- ===== Deck overview script ===== -->
    <script>
    (function () {
        // TODO: when the Decks API can store decks, load the deck from it (for example GET /api/decks/{id})
        // instead of this temporary hand-off. The Building deck page saves the published deck here (this tab only).
        const DECKS_KEY = 'jm.decks';

        const COVER_ALTS = [
            'Pixel art picnic scene by a river with a white rabbit at a wooden table',
            'Pixel art seaside view at sunset with a lighthouse and a park bench',
            'Pixel art cozy room with cats and a vintage television playing a cake video',
            'Pixel art storefront of a charming bakery called Evening Cakery',
            'Pixel art snowy winter landscape with pine trees and a mushroom house',
            'Pixel art cozy bedroom overlooking a glowing city at night'
        ];
        const TYPE_LABELS = {
            'multiple-choice': 'Multiple Choice',
            'true-false': 'True or False',
            'matching': 'Matching Type',
            'fill-blank-code': 'Fill in the Blanks Code',
            'drag-drop-code': 'Drag and Drop Code'
        };

        const $ = id => document.getElementById(id);

        function el(tag, cls, text) {
            const node = document.createElement(tag);
            if (cls) node.className = cls;
            if (text !== undefined) node.textContent = text;   // text only, so nothing typed by a player can run as code
            return node;
        }

        // The deck is chosen by the id in the address, for example  Deck overview.html?id=d1700000000000
        function loadDeck() {
            try {
                const id = new URLSearchParams(location.search).get('id');
                const list = JSON.parse(sessionStorage.getItem(DECKS_KEY));
                const deck = Array.isArray(list) ? list.find(d => String(d.id) === id) : null;
                return deck && Array.isArray(deck.cards) && deck.cards.length ? deck : null;
            } catch (e) {
                return null;
            }
        }

        // The code of a Fill in the blanks / Drag and drop question, with a numbered box where each blank is
        function codeBox(card) {
            const box = el('div', 'q-code');
            let line = el('div', 'q-code-line');
            box.appendChild(line);
            card.parts.forEach(p => {
                if (p.blank !== undefined) {
                    line.appendChild(el('span', 'q-chip', p.blank + 1));
                    return;
                }
                p.text.split('\n').forEach((seg, i) => {
                    if (i > 0) { line = el('div', 'q-code-line'); box.appendChild(line); }
                    if (seg) line.appendChild(document.createTextNode(seg));
                });
            });
            box.querySelectorAll('.q-code-line').forEach(l => { if (!l.firstChild) l.textContent = '\u00a0'; });
            return box;
        }

        function renderCard(c) {
            const card = el('article', 'q-card');
            const top = el('div', 'q-text');
            top.appendChild(el('p', 'q-question', c.question));
            const answer = el('div', 'q-answer');

            if (c.type === 'multiple-choice') {
                answer.textContent = c.options[c.correct];
            } else if (c.type === 'true-false') {
                answer.textContent = c.answer ? 'True' : 'False';
            } else if (c.type === 'matching') {
                const grid = el('div', 'q-pairs');
                c.pairs.forEach(p => {
                    grid.append(el('span', 'q-pair-item', p.item), el('span', 'q-pair-arrow', '→'), el('span', '', p.answer));
                });
                answer.appendChild(grid);
            } else {
                top.appendChild(codeBox(c));
                answer.classList.add('q-nums');
                c.answers.forEach((a, i) => {
                    const item = el('span');
                    item.append(el('span', 'q-num', i + 1), document.createTextNode(a));
                    answer.appendChild(item);
                });
            }

            card.append(top, answer);
            return card;
        }

        function render() {
            const deck = loadDeck();
            $('ovDeck').hidden = !deck;
            $('ovEmpty').hidden = !!deck;
            if (!deck) return;     
            $('ovShare').addEventListener('click', () => JMShare.open(deck.id, $('ovShare')));

            document.title = 'Java Master - ' + deck.name;
            $('ovName').textContent = deck.name;
            $('ovCover').src = '/cover/cover ' + deck.cover + '.jpg';
            $('ovCover').alt = COVER_ALTS[deck.cover - 1] || 'Deck cover';

            const tags = $('ovTags');
            tags.appendChild(el('span', 'ov-chip', deck.cards.length + (deck.cards.length === 1 ? ' Card' : ' Cards')));
            (deck.types || []).forEach(t => tags.appendChild(el('span', 'ov-chip', TYPE_LABELS[t] || t)));

            const list = $('ovCards');
            deck.cards.forEach(c => list.appendChild(renderCard(c)));
        }

        render();
    })();
    </script>
</body>
